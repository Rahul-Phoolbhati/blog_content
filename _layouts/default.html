<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: "en-US" }}">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">

{% seo %}
    <link rel="stylesheet" href="{{ "/assets/css/style.css?v=" | append: site.github.build_revision | relative_url }}">
    <link rel="stylesheet" href="{{ "/assets/css/custom.css?v=" | append: site.github.build_revision | relative_url }}">
    {% include head-custom.html %}
  </head>
  <body>
    <!-- {% if site.title and site.title != page.title %}
      <a href="{{ "/" | relative_url }}" class="home-link">[⬅ Back]</a>
      {% endif %} -->
    <div class="container-lg px-3 my-5 markdown-body">
      {% if site.title and site.title != page.title %}
      <h1><a href="{{ page.url.split(".html")[0] | relative_url }}">{{ page.title }}</a></h1>
      <!-- <h1><a href="{{ "/" | absolute_url }}">{{ site.title }}</a></h1> -->
      {% endif %}
      

      {{ content }}

      {% if site.github.private != true and site.github.license %}
      <div class="footer border-top border-gray-light mt-5 pt-3 text-right text-gray">
        This site is open source. {% github_edit_link "Improve this page" %}.
      </div>
      {% endif %}
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/anchor-js/4.1.0/anchor.min.js" integrity="sha256-lZaRhKri35AyJSypXXs4o6OPFTbTmUoltBbDCbdzegg=" crossorigin="anonymous"></script>
    <script>anchors.add();</script>
    <script type="module">
      import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs';
      mermaid.initialize({ 
        startOnLoad: true,
        theme: 'default',
        securityLevel: 'loose'
      });
      document.addEventListener("DOMContentLoaded", function() {
      // Look for the specific way Jekyll/kramdown renders code blocks
      const codeBlocks = document.querySelectorAll('code.language-mermaid');
      
      codeBlocks.forEach(block => {
        const pre = block.parentElement;
        const graphDefinition = block.textContent;
        
        // Create a new div that Mermaid can actually turn into a diagram
        const mermaidDiv = document.createElement('div');
        mermaidDiv.className = 'mermaid';
        mermaidDiv.textContent = graphDefinition;
        
        // Replace the entire <pre><code> block with our new <div>
        pre.insertAdjacentElement('afterend', mermaidDiv);
        pre.remove();
      });
      
      // Tell mermaid to initialize the newly created divs
      mermaid.run();
    });
    </script>
    <!-- <script type="module">
      import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';
      mermaid.initialize({ startOnLoad: true });
    </script> -->

  </body>
</html>
